<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shawtyy</title>
    <link rel="stylesheet" href="style/form.css">
</head>
<body>
    <center>
        <table border="2">
            <tr>
                <td colspan="2" class="head">Pizza Shop 2.0</td>
            </tr>
            <tr>
                <td>
                    Name:
                </td>
                <td><input type="text" value="Enter Your Name"></td>
                
            </tr>
            <tr>
                <td>Pizaa Toppings: </td>
                <td>
                    <input type="radio">
                    <label for="">Supreme</label><br>
                    <input type="radio">
                    <label for="">Vegterian</label><br>
                    <input type="radio">
                    <label for="">Hawaiian</label><br>
                </td>

            </tr>
            <tr>
                <td>Pizza Size</td>
                <td>
                    <select name="size">
                        <option value="">Small</option>
                        <option value="">Meduim</option>
                        <option value="">large</option>

                    </select>
                </td>
            </tr>
            <tr>
                <td>Optional Extras: </td>
                <td>
                    <input type="checkbox">
                    <label for="">Extra Cheese</label>
                    <input type="checkbox">
                    <label for="">Green Peppers</label>
                </td>
            </tr>
            <tr>
                <td colspan="2">Delivery Instructions: <br>
                    <textarea name="" id=""></textarea>
                </td>
                
            </tr>
            <tr>
                <td colspan="2">
                    <button>Send Order</button>
                </td>
            </tr>

        </table>
    </center>
</body>
</html>
